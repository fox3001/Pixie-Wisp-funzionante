name: Sito (iPad / Safari)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/app/src/main/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito (stessa creatura dell'app Android)
        run: |
          mkdir -p _site
          cp web/* _site/
          cp android/app/src/main/assets/engine.js android/app/src/main/assets/voice.js android/app/src/main/assets/lament.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
